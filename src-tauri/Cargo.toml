[package]
name = "dockman"
version = "0.1.0"
description = "Linux desktop app for controlling the local Docker Engine"
authors = ["you"]
edition = "2021"

[lib]
name = "dockman_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bollard = "0.21"
futures-util = "0.3"
tokio = { version = "1", features = ["io-util", "sync"] }
tar = "0.4"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
